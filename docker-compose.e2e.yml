# Isolated stack for the Playwright E2E suite. Driven by
# scripts/e2e.sh, locally and in CI.
#
# Its own compose project, host ports (72xx) and no fixed container names, so
# it runs next to the dev stack (71xx) without touching it. Postgres lives on a
# tmpfs: every `up` starts from an empty database, the migrations seed the
# admin below, and nothing a previous run changed can leak into the next one.
#
# OIDC is off because a fresh database has no OIDC settings. The auth rate
# limit is raised by the runner after boot, not here: it is an app_settings
# row, not an environment variable.
name: picflow-e2e

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # JWT_SECRET, the seeded admin's ADMIN_PASSWORD and DB_PASSWORD are
    # generated per run by scripts/e2e.sh into this git-ignored file, so no
    # credential is committed. The admin username is the migration default.
    env_file:
      - .e2e/backend.env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_CLIENT=pg
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=picflow
      - DB_NAME=picflow_e2e
      - FRONTEND_URL=http://localhost:7200
      - ADMIN_URL=http://localhost:7200
      - DEFAULT_LANGUAGE=zh-CN
      - TZ=UTC
      - STORAGE_PATH=/app/storage
      # external-media-gallery.spec.ts copies its fixtures into the host side of
      # this mount (scripts/e2e.sh creates it). Kept outside STORAGE_PATH, which
      # the entrypoint chowns and a read-only mount would make it fail on.
      - EXTERNAL_MEDIA_ROOT=/external-media
      - EXTERNAL_MEDIA_WATCH=false
      - PIXCAKE_BRIDGE_URL=http://127.0.0.1:8080
      - PICPEAK_INTEGRATED_BRIDGE=true
    volumes:
      - ./.e2e/external-media:/external-media:ro
    ports:
      - "127.0.0.1:7201:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=picflow
      - POSTGRES_PASSWORD=${E2E_DB_PASSWORD:?generated by scripts/e2e.sh}
      - POSTGRES_DB=picflow_e2e
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U picflow -d picflow_e2e"]
      interval: 2s
      timeout: 2s
      retries: 30

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api
        - VITE_DEFAULT_LANGUAGE=zh-CN
    ports:
      - "127.0.0.1:7200:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Run the same internal Bridge API used by the all-in-one image. Sharing the
  # backend network namespace makes 127.0.0.1:8080 match the production
  # loopback-only integration without exposing a Bridge port to the host.
  bridge:
    build:
      context: ./bridge
      dockerfile: Dockerfile
    network_mode: "service:backend"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - PICPEAK_URL=http://127.0.0.1:3000
      - DATABASE_URL=sqlite:////data/bridge.db
      - PROJECTS_FILE=/data/projects.json
      - RAW_ROOT=/external-media/Camera
      - DELIVERY_ROOT=/delivery
    volumes:
      - bridge-data:/data
      - ./.e2e/external-media:/external-media:ro
    command:
      - sh
      - -c
      - "printf '[]\\n' > /data/projects.json && exec uvicorn pixcake_bridge.app:app --host 0.0.0.0 --port 8080 --workers 1 --no-access-log"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

volumes:
  bridge-data:
