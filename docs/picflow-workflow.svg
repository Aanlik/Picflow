<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="560" viewBox="0 0 1440 560" role="img" aria-labelledby="title desc">
  <title id="title">Picflow 摄影工作流</title>
  <desc id="desc">摄影师创建项目和关联素材，客户在线选片反馈，Bridge 准备精修文件并监控成片，客户下载交付，项目归档。素材只读、每项目一个可写交付工作区，对象存储可选。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#14594f"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
      .title { fill: #173d37; font-size: 34px; font-weight: 700; }
      .eyebrow { fill: #14594f; font-size: 14px; font-weight: 700; letter-spacing: 2px; }
      .subtitle { fill: #61716b; font-size: 17px; }
      .step { fill: #14594f; font-size: 13px; font-weight: 700; letter-spacing: 1px; }
      .cardtitle { fill: #183d37; font-size: 21px; font-weight: 700; }
      .body { fill: #596a63; font-size: 15px; }
      .bandtitle { fill: #183d37; font-size: 16px; font-weight: 700; }
      .bandnote { fill: #63716b; font-size: 13px; }
      .foot { fill: #67746e; font-size: 14px; }
    </style>
  </defs>
  <rect width="1440" height="560" rx="28" fill="#f5f5ef"/>
  <text x="56" y="54" class="eyebrow">PICFLOW · PHOTOGRAPHY WORKFLOW</text>
  <text x="56" y="103" class="title">从在线选片，到成片交付</text>
  <text x="56" y="134" class="subtitle">客户、摄影师与精修流程在同一个项目中接力；每一步都有明确的照片和状态。</text>

  <g>
    <rect x="48" y="166" width="256" height="206" rx="18" fill="#ffffff" stroke="#dce5df" stroke-width="1.5"/>
    <rect x="48" y="166" width="256" height="6" rx="3" fill="#14594f"/>
    <text x="70" y="205" class="step">01 · 项目</text>
    <text x="70" y="244" class="cardtitle">关联素材</text>
    <text x="70" y="278" class="body">添加多个只读素材目录</text>
    <text x="70" y="302" class="body">每个项目保留一个精修区</text>

    <rect x="320" y="166" width="256" height="206" rx="18" fill="#ffffff" stroke="#dce5df" stroke-width="1.5"/>
    <rect x="320" y="166" width="256" height="6" rx="3" fill="#f57962"/>
    <text x="342" y="205" class="step">02 · 客户</text>
    <text x="342" y="244" class="cardtitle">在线选片</text>
    <text x="342" y="278" class="body">选择精修照片、点赞、评分</text>
    <text x="342" y="302" class="body">按照片留下评论和需求</text>

    <rect x="592" y="166" width="256" height="206" rx="18" fill="#ffffff" stroke="#dce5df" stroke-width="1.5"/>
    <rect x="592" y="166" width="256" height="6" rx="3" fill="#14594f"/>
    <text x="614" y="205" class="step">03 · 准备</text>
    <text x="614" y="244" class="cardtitle">匹配精修素材</text>
    <text x="614" y="278" class="body">Bridge 匹配 RAW 原片</text>
    <text x="614" y="302" class="body">准备待精修文件</text>

    <rect x="864" y="166" width="256" height="206" rx="18" fill="#ffffff" stroke="#dce5df" stroke-width="1.5"/>
    <rect x="864" y="166" width="256" height="6" rx="3" fill="#f57962"/>
    <text x="886" y="205" class="step">04 · 摄影师</text>
    <text x="886" y="244" class="cardtitle">精修与返修</text>
    <text x="886" y="278" class="body">使用现有后期软件工作</text>
    <text x="886" y="302" class="body">Bridge 监控并回传成片版本</text>

    <rect x="1136" y="166" width="256" height="206" rx="18" fill="#ffffff" stroke="#dce5df" stroke-width="1.5"/>
    <rect x="1136" y="166" width="256" height="6" rx="3" fill="#14594f"/>
    <text x="1158" y="205" class="step">05 · 交付</text>
    <text x="1158" y="244" class="cardtitle">下载与归档</text>
    <text x="1158" y="278" class="body">原片与精修成片权限分开</text>
    <text x="1158" y="302" class="body">可选对象存储并归档项目</text>
  </g>

  <path d="M306 268H316M578 268H588M850 268H860M1122 268H1132" stroke="#14594f" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="52" y="414" class="step">文件边界</text>
  <rect x="48" y="430" width="424" height="64" rx="14" fill="#e9f1ec"/>
  <text x="68" y="457" class="bandtitle">NAS 素材目录 · 只读挂载</text>
  <text x="68" y="480" class="bandnote">素材目录只读；需要改写输入时使用隔离副本</text>

  <rect x="508" y="430" width="424" height="64" rx="14" fill="#ffffff" stroke="#dce5df"/>
  <text x="528" y="457" class="bandtitle">精修交付工作区 · 可写</text>
  <text x="528" y="480" class="bandnote">每个项目一个工作区，保存待精修文件和成片</text>

  <rect x="968" y="430" width="424" height="64" rx="14" fill="#fff0eb"/>
  <text x="988" y="457" class="bandtitle">对象存储 · 按需启用</text>
  <text x="988" y="480" class="bandnote">可选同步精修成片、缩略图或预览图</text>

  <text x="52" y="532" class="foot">专业后期软件继续负责修图；Picflow 管理选片、反馈、版本与交付状态。</text>
</svg>
