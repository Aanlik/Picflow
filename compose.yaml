name: picflow
services:
  picflow:
    image: picflow:1.0.5
    build:
      context: .
      dockerfile: Dockerfile
    # Copy only configuration into the service volume to support NAS owner-only bind permissions.
    entrypoint:
    - dumb-init
    - --
    - /bin/sh
    - -ec
    - '[ -e /bridge-data/projects.json ] || cp /config/projects.json /bridge-data/projects.json; chown ${BRIDGE_UID:-1001}:${BRIDGE_GID:-1001} /bridge-data/projects.json; chmod 640 /bridge-data/projects.json; exec /opt/integrated/start.sh'
    environment:
      PORT: '3000'
      PICFLOW_GITHUB_REPOSITORY: ${PICFLOW_GITHUB_REPOSITORY:-${PHOFLOW_GITHUB_REPOSITORY:-Aanlik/Picflow}}
      PIXCAKE_BRIDGE_URL: http://127.0.0.1:8080
      DATABASE_CLIENT: sqlite3
      EXTERNAL_MEDIA_ROOT: /external-media
      EXTERNAL_MEDIA_WATCH_POLLING: 'true'
      EXTERNAL_MEDIA_WATCH_SWEEP_INTERVAL_MS: '60000'
      TZ: Asia/Shanghai
      PICPEAK_URL: http://127.0.0.1:3000
      BRIDGE_UID: ${BRIDGE_UID:-1001}
      BRIDGE_GID: ${BRIDGE_GID:-1001}
      PICPEAK_UID: ${PICFLOW_UID:-${PHOFLOW_UID:-${PICPEAK_UID:-1001}}}
      PICPEAK_GID: ${PICFLOW_GID:-${PHOFLOW_GID:-${PICPEAK_GID:-1001}}}
      DATABASE_URL: sqlite:////bridge-data/bridge.db
      PROJECTS_FILE: /bridge-data/projects.json
      RAW_ROOT: /external-media/Camera
      RAW_HOST_ROOT: ${NAS_RAW_ROOT:-${NAS_CAMERA_ROOT:?填写 NAS Camera 绝对路径}}
      DELIVERY_ROOT: /delivery
      DELIVERY_HOST_ROOT: ${NAS_DELIVERY_ROOT:-}
      # New projects are scoped by their Camera-relative folder under this one
      # writable mount; existing PROJECT_DELIVERY_MOUNTS remain compatible.
      PROJECT_DELIVERY_MOUNTS: ${PROJECT_DELIVERY_MOUNTS:-}
      POLL_SECONDS: ${POLL_SECONDS:-30}
      STABLE_SECONDS: ${STABLE_SECONDS:-10}
      MAX_FINAL_BYTES: ${MAX_FINAL_BYTES:-104857600}
      HISTORY_KEEP: ${HISTORY_KEEP:-3}
      RAW_MATERIALIZE_MODE: ${RAW_MATERIALIZE_MODE:-auto}
      WATCHFILES_FORCE_POLLING: 'true'
    ports:
    - ${LAN_BIND_IP:-127.0.0.1}:${PICFLOW_PORT:-${PHOFLOW_PORT:-${PICPEAK_PORT:-3000}}}:3000
    volumes:
    - picflow-data:/data
    - picflow-bridge-data:/bridge-data
    # Camera (including RAW) stays read-only. PixCakeDelivery may live under
    # Camera on the NAS, but receives a separate writable mount below.
    - type: bind
      source: ${NAS_CAMERA_ROOT:?填写现有 NAS Camera 绝对路径}
      target: /external-media/Camera
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ${NAS_DELIVERY_ROOT:?填写 NAS 交付目录绝对路径}
      target: /delivery
      bind:
        create_host_path: false
    # Retained only for existing projects already using a dedicated bind.
    # New projects do not require this mount or a per-project Compose change.
    - type: bind
      source: ${NAS_PROJECT_DELIVERY_ROOT:-${NAS_DELIVERY_ROOT:?填写 NAS 交付目录绝对路径}}
      target: /delivery-project
      bind:
        create_host_path: false
    networks:
    - photos
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    stop_grace_period: 60s
networks:
  photos:
    driver: bridge
volumes:
  picflow-data:
    name: phoflow_data
  picflow-bridge-data:
    name: phoflow_bridge_data
