name: Picflow
on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        type: boolean
        default: false
        description: Publish the verified fixed-version image
permissions:
  contents: read
jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --directory bridge --frozen --python 3.12 --extra test
      - run: uv run --directory bridge pytest -q
      - run: uvx pip-audit -r bridge/requirements.lock
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix frontend --legacy-peer-deps
      - run: npm audit --omit=dev --prefix frontend
      - run: node scripts/check-zh-cn.mjs && node scripts/check-locale-usage.mjs
      - run: node --test scripts/check-zh-cn.test.mjs
      - run: npm --prefix frontend test
      - run: npm --prefix frontend run build:check
      - run: npm --prefix frontend run lint
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --prefix backend
      - run: npm audit --omit=dev --prefix backend
      - run: npm --prefix backend run lint
      - run: npm --prefix backend test -- --runInBand --silent
        env:
          SKIP_S3_TESTS: 'true'
  image:
    runs-on: ubuntu-latest
    needs: [bridge, frontend, backend]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Resolve Picflow version
        id: picflow
        run: |
          image=$(scripts/picflow-image.sh)
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "version=${image##*:}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          tags: ${{ steps.picflow.outputs.image }}
          build-args: |
            PICFLOW_VERSION=${{ steps.picflow.outputs.version }}
            PICFLOW_REVISION=${{ github.sha }}
          load: true
          cache-from: type=gha,scope=picflow
          cache-to: type=gha,mode=max,scope=picflow
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --directory bridge --frozen --python 3.12 --extra test
      - name: Container boot and restart
        env:
          PICFLOW_IMAGE: ${{ steps.picflow.outputs.image }}
        run: bridge/docker/integrated/smoke.sh
      - name: Picflow client workflow end-to-end
        env:
          PICFLOW_IMAGE: ${{ steps.picflow.outputs.image }}
          EXPECTED_PICFLOW_VERSION: ${{ steps.picflow.outputs.version }}
          EXPECTED_PICFLOW_REVISION: ${{ github.sha }}
        run: |
          mkdir -p /tmp/pixcake-fixture/proofs/shoot
          docker run -d --name pixcake-e2e -p 127.0.0.1:19300:3000 -e PORT=3000 -e PICPEAK_INTEGRATED_BRIDGE=true -e EXTERNAL_MEDIA_ROOT=/external-media -v /tmp/pixcake-fixture/proofs:/external-media:ro "$PICFLOW_IMAGE"
          uv run --directory bridge python scripts/integration.py --container pixcake-e2e --root /tmp/pixcake-fixture --count 100 --report integration-report.json
      - name: Mobile browser downloads
        run: |
          npm ci
          npx playwright install --with-deps chromium webkit
          DOWNLOAD_FIXTURE_REPORT=bridge/integration-report.json PLAYWRIGHT_BASE_URL=http://127.0.0.1:19300 npx playwright test --config playwright.downloads.config.ts
      - if: always()
        run: docker rm -f pixcake-e2e || true
      - name: Publish only after manual approval of a release run
        if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PICFLOW_IMAGE: ${{ steps.picflow.outputs.image }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          version=${PICFLOW_IMAGE##*:}
          target="ghcr.io/$owner/picflow:$version"
          docker tag "$PICFLOW_IMAGE" "$target"
          docker push "$target"
