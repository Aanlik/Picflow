name: Picflow
on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        type: boolean
        default: false
        description: Publish the fixed-version image
permissions:
  contents: read
jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --directory bridge --frozen --python 3.12
      - run: uvx pip-audit -r bridge/requirements.lock
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix frontend --legacy-peer-deps
      - run: npm audit --omit=dev --prefix frontend
      - run: node scripts/check-zh-cn.mjs && node scripts/check-locale-usage.mjs
      - run: npm --prefix frontend run build:check
      - run: npm --prefix frontend run lint
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --prefix backend
      - run: npm audit --omit=dev --prefix backend
      - run: npm --prefix backend run lint
  image:
    runs-on: ubuntu-latest
    needs: [bridge, frontend, backend]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Resolve Picflow version
        id: picflow
        run: |
          image=$(scripts/picflow-image.sh)
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "version=${image##*:}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          tags: ${{ steps.picflow.outputs.image }}
          build-args: |
            PICFLOW_VERSION=${{ steps.picflow.outputs.version }}
            PICFLOW_REVISION=${{ github.sha }}
          load: true
          cache-from: type=gha,scope=picflow
          cache-to: type=gha,mode=max,scope=picflow
      - name: Publish only after manual approval of a release run
        if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PICFLOW_IMAGE: ${{ steps.picflow.outputs.image }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          version=${PICFLOW_IMAGE##*:}
          target="ghcr.io/$owner/picflow:$version"
          docker tag "$PICFLOW_IMAGE" "$target"
          docker push "$target"
